name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Install dmgbuild
        run: pip3 install --break-system-packages dmgbuild
      - name: Package
        run: |
          V="${GITHUB_REF_NAME#v}"
          # zip 供应用内自动更新使用，dmg 供首次手动安装
          (cd build && ditto -c -k --keepParent SwitchBoard.app "SwitchBoard-$V.zip")
          ./scripts/make-dmg.sh "$V"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/SwitchBoard-*.dmg build/SwitchBoard-*.zip --title "$GITHUB_REF_NAME" --generate-notes
