name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent SwitchBoard.app "SwitchBoard-${GITHUB_REF_NAME#v}.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/SwitchBoard-*.zip --title "$GITHUB_REF_NAME" --generate-notes
